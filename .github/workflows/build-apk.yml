name: Gerar APK

# Compila e testa o RoutinLife no GitHub e publica o APK como asset da release v0.3.0,
# gerando um link público de download (releases/download/v0.3.0/...).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compilar APK de teste
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Garantir Android SDK 34
        run: |
          set -eu
          SM="$(find "${ANDROID_HOME:-/nonexistent}" -type f -name sdkmanager -path '*/bin/*' 2>/dev/null | head -n 1 || true)"
          echo "sdkmanager: ${SM:-não encontrado}"
          if [ -n "$SM" ]; then
            yes | "$SM" --licenses >/dev/null 2>&1 || true
            "$SM" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1 || true
          fi

      - name: Configurar Gradle 8.7
        run: |
          set -eu
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Rodar os testes da lógica semanal
        run: gradle test --no-daemon --stacktrace

      - name: Compilar APK de teste
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar o APK na release v0.3.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APK="app/build/outputs/apk/debug/app-debug.apk"
          DEST="$RUNNER_TEMP/RoutinLife-0.3.0-debug.apk"
          cp "$APK" "$DEST"
          ls -la "$DEST"
          if ! gh release view v0.3.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.3.0 --repo "$GITHUB_REPOSITORY" \
              --title "RoutinLife 0.3.0 — rotina semanal" \
              --notes "Rotina organizada por dia da semana: cada dia (Segunda ... Domingo) tem a sua própria lista, com alarmes e conclusões independentes. Os dados da versão anterior são migrados automaticamente para os 7 dias. APK de teste (debug) compilado e testado automaticamente pelo GitHub Actions a partir de \`main\`." \
              --latest
          fi
          gh release upload v0.3.0 "$DEST" --repo "$GITHUB_REPOSITORY" --clobber
